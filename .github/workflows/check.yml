name: Native checks
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/export_header.py
      - run: git diff --exit-code -- include/posebridge.h
      - run: python tests/osc_cli_smoke.py
      - name: C ABI and C11 consumer checks
        run: python scripts/check_c_api.py
