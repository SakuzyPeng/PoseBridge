[package]
name = "posebridge-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
posebridge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu", "wayland", "x11"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6", "wayland", "xdg-portal"] }
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.11"
sha2 = "0.10"

[dev-dependencies]
rosc.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(windows)'.dependencies]
# gpu-allocator 0.28 accepts <=0.62 (i.e. 0.62.0), while wgpu-hal requires ^0.62.
# Pin their common bindings so the allocator and renderer share COM types.
windows = { version = "=0.62.0", default-features = false }
